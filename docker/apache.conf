<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On

    # Let PHP receive the original /api/... request URI for its route dispatch.
    RewriteRule ^/?api/index\.php$ - [END]
    RewriteRule ^/?api(?:/.*)?$ /api/index.php [END,QSA]

    # Serve static build files directly and send other browser routes to React.
    RewriteCond %{REQUEST_URI} !^/api(?:/|$)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [END]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
